<!doctype html>
<html lang="en" data-theme="light" data-ui="pro">
<head>
  <meta charset="utf-8">
  <title>Andy Alvarez · Systems & Full-Stack Engineer</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Andy Alvarez, Systems & Full-Stack Engineer. I build software and hardware that run in the real world, from embedded systems to full-stack apps.">
  <meta name="theme-color" content="#FAFAF8">
  <link rel="icon" href="favicon.svg?v=d" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=d">
  <link rel="icon" href="favicon.ico?v=d" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=d">
  <!--
    Public site URL for canonical + Open Graph tags.
    When the custom domain is ready, replace https://andy.inspirehomehub.com
    in the canonical, og:url, og:image, and twitter:image tags below
    (and SITE_ORIGIN in src/app/data/site.ts).
  -->
  <link rel="canonical" href="https://andy.inspirehomehub.com/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Andy Alvarez · Systems & Full-Stack Engineer">
  <meta property="og:description" content="I build software and hardware that run in the real world, from embedded systems to full-stack apps.">
  <meta property="og:url" content="https://andy.inspirehomehub.com/">
  <meta property="og:image" content="https://andy.inspirehomehub.com/assets/og-card.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Andy Alvarez, Systems & Full-Stack Engineer">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Andy Alvarez · Systems & Full-Stack Engineer">
  <meta name="twitter:description" content="I build software and hardware that run in the real world, from embedded systems to full-stack apps.">
  <meta name="twitter:image" content="https://andy.inspirehomehub.com/assets/og-card.png">
  <!-- Set theme before first paint. Keep in sync with ThemeService. -->
  <script>
    (function () {
      var d = document, h = d.documentElement, ok = { light: 1, dark: 1, atomic: 1 }, t = null;
      try {
        var q = new URLSearchParams(location.search).get('theme');
        if (q && ok[q]) { t = q; localStorage.setItem('theme', q); }
        else { var s = localStorage.getItem('theme'); if (s && ok[s]) t = s; }
      } catch (e) {}
      if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      h.setAttribute('data-theme', t);
      h.setAttribute('data-ui', t === 'atomic' ? 'atomic' : 'pro');
      var m = d.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', { light: '#FAFAF8', dark: '#0B0F17', atomic: '#0B0B12' }[t]);
      var f = t === 'atomic'
        ? [['Orbitron-Variable.ttf', 'font/ttf'], ['VT323-Regular.ttf', 'font/ttf']]
        : [['SchibstedGrotesk-Variable.woff2', 'font/woff2'], ['MartianMono-Variable.woff2', 'font/woff2']];
      for (var i = 0; i < f.length; i++) {
        var l = d.createElement('link');
        l.rel = 'preload'; l.as = 'font'; l.type = f[i][1]; l.crossOrigin = 'anonymous'; l.href = '/assets/fonts/' + f[i][0];
        d.head.appendChild(l);
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
